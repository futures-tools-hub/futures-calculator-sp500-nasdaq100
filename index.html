<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futures Lot Calculator – S&P 500 & NASDAQ-100</title>
<style>
:root{color-scheme:dark;--bg:#070a0f;--panel:#0e141c;--line:#26364a;--text:#e7edf4;--muted:#8494a7;--green:#16c784;--red:#ea3943;--amber:#f0b90b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0,#251b09 0,transparent 35%),var(--bg);color:var(--text);font:16px system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:28px 18px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}section{background:linear-gradient(#0e141c,#0b1017);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 12px 34px #0008}h1{font-size:1.5rem;margin:0 0 22px;color:var(--amber)}h2{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 20px}label{display:block;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;margin:16px 0 7px}select,input,button{font:inherit}select,input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0a0f16;color:var(--text);font-size:1.05rem}select:focus,input:focus{outline:2px solid var(--amber)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.units{display:grid;grid-template-columns:1fr 1fr;gap:8px}.units button,.preset{padding:10px;border:1px solid var(--line);border-radius:8px;background:#0a0f16;color:var(--muted);cursor:pointer}.units button.active,.units button:hover,.preset:hover{color:var(--amber);border-color:var(--amber)}.meta,.hint{color:var(--muted);font-size:.78rem;margin-top:7px}.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.cardrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:18px;border-radius:11px}.tp{border:1px solid #16c78466;background:#16c78418}.sl{border:1px solid #ea394366;background:#ea394318}.caption{font-size:.75rem;text-transform:uppercase;letter-spacing:.13em}.tp .caption{color:var(--green)}.sl .caption{color:var(--red)}.amount{font-size:clamp(1.4rem,4vw,2rem);font-weight:700;margin-top:10px}.tp .amount{color:var(--green)}.sl .amount{color:var(--red)}.formula{font-size:.72rem;color:var(--muted);margin-top:8px;line-height:1.5}.details{margin-top:18px;border-top:1px solid #172130}.detail{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px dashed #1c2735}.detail span:first-child{color:var(--muted)}.detail span:last-child{font-family:ui-monospace,monospace;text-align:right}.ratio{text-align:center;margin:16px 0;padding:10px;border:1px solid var(--line);border-radius:8px;color:var(--amber)}.error{color:#ff7b83;margin-top:8px;font-size:.8rem}
</style>
</head>
<body><main><h1>Futures TP/SL- & Lot-Rechner</h1><div class="grid"><section><h2>Eingaben</h2><label for="asset">Asset / Kontrakt</label><select id="asset"><option value="MNQ">MNQ – Micro E-mini NASDAQ-100</option><option value="MES">MES – Micro E-mini S&amp;P 500</option><option value="NQ">NQ – E-mini NASDAQ-100</option><option value="ES">ES – E-mini S&amp;P 500</option></select><div class="meta" id="meta"></div><label for="lots">Anzahl Lots / Kontrakte</label><input id="lots" type="number" min="1" step="1" value="7"><div id="err" class="error"></div><label>Einheit für TP / SL</label><div class="units"><button id="points" class="active">Punkte</button><button id="ticks">Ticks</button></div><div class="hint">1 Punkt = 4 Ticks · Tickgröße = 0,25 Punkte</div><div class="row"><div><label for="tp">Take-Profit</label><input id="tp" type="text" inputmode="decimal" value="15"><div id="tph" class="hint"></div></div><div><label for="sl">Stop-Loss</label><input id="sl" type="text" inputmode="decimal" value="15"><div id="slh" class="hint"></div></div></div><div class="presets"><button class="preset" data-p="0">MNQ · 7 · 15 P</button><button class="preset" data-p="1">MES · 1 · 4 Ticks</button><button class="preset" data-p="2">ES · 2 · SL 10 P</button><button class="preset" data-p="3">NQ · 3 · TP 2,5 P</button></div></section><section><h2>Ergebnis <span id="symbol"></span></h2><div class="cardrow"><div class="card tp"><div class="caption">▲ Take-Profit</div><div class="amount" id="tpout">—</div><div class="formula" id="tpf"></div></div><div class="card sl"><div class="caption">▼ Stop-Loss</div><div class="amount" id="slout">—</div><div class="formula" id="slf"></div></div></div><div class="ratio" id="ratio"></div><div class="details"><div class="detail"><span>Asset</span><span id="dasset"></span></div><div class="detail"><span>Anzahl Kontrakte</span><span id="dlots"></span></div><div class="detail"><span>Punktewert / Kontrakt</span><span id="dpv"></span></div><div class="detail"><span>Tickwert / Kontrakt</span><span id="dtv"></span></div><div class="detail"><span>Take-Profit</span><span id="dtp"></span></div><div class="detail"><span>Stop-Loss</span><span id="dsl"></span></div></div></section></div></main>
<script>
(()=>{const A={MNQ:['Micro E-mini NASDAQ-100',2,.5],MES:['Micro E-mini S&P 500',5,1.25],NQ:['E-mini NASDAQ-100',20,5],ES:['E-mini S&P 500',50,12.5]};let unit='p';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n),val=n=>new Intl.NumberFormat('de-DE',{maximumFractionDigits:4}).format(n),num=x=>{x=String(x).trim().replace(',','.');return x===''?null:Number(x)};function calc(){let s=$('asset').value,a=A[s],l=num($('lots').value),t=num($('tp').value),q=num($('sl').value),u=unit==='p'?a[1]:a[2],ul=unit==='p'?'Punkte':'Ticks';$('symbol').textContent=s;$('meta').textContent=`${a[0]} · Punktewert ${fmt(a[1])} USD · Tickwert ${fmt(a[2])} USD`;$('err').textContent=(!Number.isInteger(l)||l<1)?'Bitte eine ganze Anzahl größer als 0 eingeben.':'';let ok=Number.isInteger(l)&&l>0;[['tp',t],['sl',q]].forEach(([id,n])=>$(id+'h').textContent=typeof n==='number'&&Number.isFinite(n)?`= ${val(unit==='p'?n*4:n/4)} ${unit==='p'?'Ticks':'Punkte'}`:'');function out(n,id,f,p){if(ok&&typeof n==='number'&&Number.isFinite(n)&&n>=0){let x=l*n*u;$(id).textContent=(p||'')+fmt(x)+' USD';$(f).textContent=`${l} × ${val(n)} ${ul} × ${fmt(u)} USD = ${fmt(x)} USD`;return x}$(id).textContent='—';$(f).textContent='';return null}let x=out(t,'tpout','tpf','+'),y=out(q,'slout','slf','−');$('dasset').textContent=s+' · '+a[0];$('dlots').textContent=ok?l:'—';$('dpv').textContent=fmt(a[1])+' USD';$('dtv').textContent=fmt(a[2])+' USD';$('dtp').textContent=x===null?'—':val(t)+' '+ul;$('dsl').textContent=y===null?'—':val(q)+' '+ul;if(x>0&&y>0){$('ratio').textContent='Risk-Reward-Verhältnis: 1 : '+fmt(x/y)}else $('ratio').textContent=''}function setUnit(u){if(u===unit)return;[$('tp'),$('sl')].forEach(i=>{let n=num(i.value);if(typeof n==='number'&&Number.isFinite(n))i.value=val(u==='t'?n*4:n/4)});unit=u;$('points').classList.toggle('active',u==='p');$('ticks').classList.toggle('active',u==='t');calc()}$('asset').onchange=calc;['lots','tp','sl'].forEach(id=>$(id).oninput=calc);$('points').onclick=()=>setUnit('p');$('ticks').onclick=()=>setUnit('t');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let p=[['MNQ',7,'p',15,15],['MES',1,'t',4,''],['ES',2,'p','',10],['NQ',3,'p','2,5','']][b.dataset.p];$('asset').value=p[0];$('lots').value=p[1];if(p[2]!==unit)setUnit(p[2]);$('tp').value=p[3];$('sl').value=p[4];calc()});calc()})()
</script></body></html>
